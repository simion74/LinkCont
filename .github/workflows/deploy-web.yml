name: Deploy Flutter Web Preview to GitHub Pages

# শুধু UI/ডিজাইন প্রিভিউ দেখার জন্য একটা শেয়ারযোগ্য লাইভ লিংক — main
# ব্রাঞ্চে push হলেই অটো আপডেট হবে। স্ক্রিন-শেয়ার/রিমোট-কন্ট্রোলের আসল
# ফাংশনালিটি এখানে কাজ করবে না (সেগুলো Android/Windows-স্পেসিফিক নেটিভ
# ফিচার) — এটা শুধু লে-আউট/ডিজাইন দেখার জন্য।
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # build.yml (APK/Windows) এর সাথে সামঞ্জস্য রাখতে এখানেও একই ভার্সন
      # পিন করা হলো — 'stable' channel প্রতিবার এগিয়ে যাওয়ায় মাঝে মাঝে
      # অপ্রত্যাশিতভাবে নতুন টুলচেইন দাবি করছিল
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.7"
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Enable web support
        run: flutter config --enable-web

      # GitHub Pages প্রজেক্ট-পেজ হিসেবে সার্ভ হয় (https://<user>.github.io/<repo>/),
      # তাই base-href রিপোর নাম দিয়ে সেট করতে হয় — নাহলে CSS/JS/asset লোড হবে না
      - name: Build web (release)
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      # enablement: true দিলে Pages প্রথমবার এখনো ম্যানুয়ালি চালু করা না থাকলেও
      # ওয়ার্কফ্লো নিজেই এটা চালু করার চেষ্টা করবে (আগে এই লাইন ছাড়া এরর
      # আসছিল: "Get Pages site failed... repository has Pages enabled")
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - id: deployment
        uses: actions/deploy-pages@v4
