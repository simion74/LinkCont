name: Build APK

# main branch-এ push হলে, pull request খুললে, অথবা ম্যানুয়ালি "Run workflow"
# চাপলে — বিল্ড চলবে। "v1.0.0"-এর মতো ট্যাগ push করলে APK একটা GitHub
# Release-এ অ্যাটাচ হয়ে যাবে।
#
# ⚠️ Windows জব সম্পূর্ণ সরিয়ে ফেলা হলো — প্রজেক্টের স্কোপ এখন শুধু Android
# (মোবাইল/ট্যাব/TV)। Windows-এ Flutter-এর একটা upstream CMake/MSBuild
# জেনারেটর বাগ (MSB8066 "items cannot be built in parallel") একাধিক
# ভার্সন ও ফ্রেশ-ক্লিন রিট্রাইয়ের পরেও ধারাবাহিকভাবে হচ্ছিল, যেটার নিশ্চিত
# ফিক্স নেই — তাই সেই অংশ বাদ দেওয়া হলো।
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  # ================= ANDROID (সব Android — মোবাইল/ট্যাব/টিভি একই APK) =================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.7"
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (এরর হলেও বিল্ড থামবে না, শুধু রিপোর্ট দেখাবে)
        run: flutter analyze || true

      # --release-এর বদলে universal APK (সব ABI-তে চলবে — arm/arm64/x86_64)
      - name: Build APK (release, universal)
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: linkcont-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  # ================= RELEASE (শুধু ট্যাগ push হলে) =================
  release:
    name: Attach APK to GitHub Release
    needs: [build-android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create/Update Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/linkcont-android-apk/app-release.apk
