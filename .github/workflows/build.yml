name: Build APK & Windows

# main branch-এ push হলে, pull request খুললে, অথবা ম্যানুয়ালি "Run workflow"
# চাপলে — এই তিনভাবেই বিল্ড চলবে। "v1.0.0"-এর মতো ট্যাগ push করলে দুটো বিল্ডই
# একটা GitHub Release-এ অ্যাটাচ হয়ে যাবে।
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  # ================= ANDROID (সব Android — মোবাইল/ট্যাব/টিভি একই APK) =================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # নির্দিষ্ট ভার্সন পিন করা হলো (আগে 'stable' channel ছিল, যেটা প্রতিবার
      # রান হওয়ার সময় সবচেয়ে নতুন Flutter টেনে আনতো — ফলে প্রতিবার নতুন
      # Gradle/AGP/Kotlin দাবি করে বিল্ড ভেঙে যাচ্ছিল। এখন একটা নির্দিষ্ট,
      # টেস্ট-করা ভার্সনে আটকে রাখা হলো যাতে বিল্ড স্থিতিশীল থাকে)
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.7"
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (এরর হলেও বিল্ড থামবে না, শুধু রিপোর্ট দেখাবে)
        run: flutter analyze || true

      # --release-এর বদলে universal APK (সব ABI-তে চলবে — arm/arm64/x86_64)
      - name: Build APK (release, universal)
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: remote-screen-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  # ================= WINDOWS (কম্পিউটার) =================
  build-windows:
    name: Build Windows EXE
    # windows-latest মানে GitHub সবসময় সবচেয়ে নতুন/প্রিভিউ Visual Studio
    # টুলসেট ব্যবহার করে — এটাই flutter_assemble বিল্ড স্টেপ ভেঙে দিচ্ছিল
    # (MSB8066)। windows-2022 = স্থিতিশীল VS2022 টুলসেট, Flutter-এর সাথে
    # নির্ভরযোগ্যভাবে কাজ করে।
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      # নির্দিষ্ট ভার্সন পিন করা হলো (আগে 'stable' channel ছিল, যেটা প্রতিবার
      # রান হওয়ার সময় সবচেয়ে নতুন Flutter টেনে আনতো — ফলে প্রতিবার নতুন
      # Gradle/AGP/Kotlin দাবি করে বিল্ড ভেঙে যাচ্ছিল। এখন একটা নির্দিষ্ট,
      # টেস্ট-করা ভার্সনে আটকে রাখা হলো যাতে বিল্ড স্থিতিশীল থাকে)
      # cache: false — এই কথোপকথনে কয়েকবার Flutter ভার্সন বদলানোর ফলে
      # GitHub Actions-এর ক্যাশ করা Flutter SDK কপি সম্ভবত আংশিক/ভাঙা হয়ে
      # গিয়েছিল (tool_backend.bat-এর মতো জরুরি ফাইল অনুপস্থিত ছিল, যেটা
      # ephemeral flutter_windows.dll জেনারেট করে) — "no such file or
      # directory" এররটার এটাই সবচেয়ে সম্ভাব্য কারণ। ক্যাশ বন্ধ করে দিলে
      # প্রতিবার সম্পূর্ণ, ঠিকঠাক Flutter SDK ডাউনলোড হবে (একটু ধীর হবে,
      # কিন্তু নির্ভরযোগ্য)।
      # ⚠️ পরীক্ষামূলকভাবে পুরনো ভার্সনে পিন করা হলো — 3.44.7-এ প্রতিটা CI রানে
      # ফ্রেশ ক্লিনের পরও একই MSB8066 "items cannot be built in parallel" এরর
      # আসছিল (windows/flutter/CMakeLists.txt-এর flutter_windows.dll মাল্টি-আউটপুট
      # custom_command থেকে VS-generator দুটো ভিন্ন-কেসের rule জেনারেট করে ফেলছিল)।
      # এটা নতুন Flutter ভার্সনের CMake রিফ্যাক্টরের (windows/x64 subdir) সাথে সম্পর্কিত
      # রিগ্রেশন কিনা যাচাই করতে পুরনো stable ভার্সনে টেস্ট করা হচ্ছে। কাজ না করলে
      # এই লাইনটা আবার 3.44.7-এ ফেরত দিতে হবে (বা অন্য ভার্সনে চেষ্টা করতে হবে)।
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: "stable"
          cache: false

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (এরর হলেও বিল্ড থামবে না, শুধু রিপোর্ট দেখাবে)
        run: flutter analyze
        continue-on-error: true

      - name: Enable Windows desktop support
        run: flutter config --enable-windows-desktop

      - name: Precache Windows engine artifacts
        run: flutter precache --windows --force

      # -v (verbose) যোগ করা হলো — MSB8066 শুধু "একটা স্টেপ ফেইল করেছে" বলে,
      # আসল কারণ (কোন Dart/প্লাগইন ফাইলে সমস্যা) ডিফল্ট মোডে দেখায় না।
      # verbose মোডে Flutter তার ভেতরের সব স্টেপ প্রিন্ট করবে, তাই আসল
      # এররটা এবার লগে দেখা যাবে।
      # Flutter-এর Windows CMake বিল্ড সিস্টেমে একটা পরিচিত race-condition bug
      # আছে (flutter/flutter#84115, #127686, #117754): flutter_windows.dll
      # জেনারেট করা আর flutter_assemble রুল কখনো কখনো একসাথে চালানোর চেষ্টা
      # হয়, ফলে "items cannot be built in parallel" বলে ফেইল করে।
      #
      # আগের retry ভুল ছিল: শুধু `flutter build windows` আবার চালানো হতো,
      # কিন্তু build\ ফোল্ডারের CMakeCache.txt ডিলিট না করার কারণে দ্বিতীয়বারও
      # সেই একই ভাঙা/অসামঞ্জস্যপূর্ণ CMake কনফিগারেশন রিইউজ হয়ে যাচ্ছিল
      # (লগে "Configuring done (0.0s)" প্রমাণ করে এটা রিজেনারেট হচ্ছিল না)।
      # তাই এবার retry-র আগে build\windows আর windows\flutter\ephemeral
      # সম্পূর্ণ ডিলিট করে দেওয়া হচ্ছে, যাতে সত্যিকারের ফ্রেশ CMake
      # কনফিগারেশন থেকে আবার বিল্ড হয়।
      - name: Build Windows (release, with true clean retry for known Flutter CMake race-condition)
        shell: pwsh
        run: |
          flutter build windows --release -v
          if ($LASTEXITCODE -ne 0) {
            Write-Host "প্রথম চেষ্টা ব্যর্থ (পরিচিত Flutter CMake race-condition) — build ক্যাশ মুছে ফ্রেশ থেকে আবার চেষ্টা করা হচ্ছে..."
            Remove-Item -Recurse -Force "build\windows" -ErrorAction SilentlyContinue
            Remove-Item -Recurse -Force "windows\flutter\ephemeral" -ErrorAction SilentlyContinue
            flutter build windows --release -v
            if ($LASTEXITCODE -ne 0) {
              Write-Host "দ্বিতীয় চেষ্টাও ব্যর্থ — আবার ফ্রেশ ক্লিন করে শেষবার চেষ্টা করা হচ্ছে..."
              Remove-Item -Recurse -Force "build\windows" -ErrorAction SilentlyContinue
              Remove-Item -Recurse -Force "windows\flutter\ephemeral" -ErrorAction SilentlyContinue
              flutter build windows --release -v
            }
          }

      # পুরো Release ফোল্ডার (exe + দরকারি .dll + data) একটা zip-এ — এটাই
      # ব্যবহারকারীকে দেওয়ার মতো ইনস্টলযোগ্য বান্ডেল
      - name: Zip the Windows build
        run: |
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "remote-screen-windows.zip"
        shell: pwsh

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: remote-screen-windows
          path: remote-screen-windows.zip
          if-no-files-found: error

  # ================= RELEASE (শুধু ট্যাগ push হলে) =================
  release:
    name: Attach builds to GitHub Release
    needs: [build-android, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create/Update Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/remote-screen-android-apk/app-release.apk
            artifacts/remote-screen-windows/remote-screen-windows.zip
