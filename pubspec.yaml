name: linkcont
description: LinkCont — P2P live screen share + voice + remote control between Android devices (mobile, tablet, TV)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_webrtc: ^1.6.0      # WebRTC পিয়ার কানেকশন, স্ক্রিন-ক্যাপচার স্ট্রিম হ্যান্ডলিং
  web_socket_channel: ^2.4.0   # শুধু signaling-এর জন্য (call-request/SDP/ICE পাস করাতে)
  permission_handler: ^11.3.0
  shared_preferences: ^2.2.3  # ফোনে স্থায়ী ইউনিক আইডি সেভ রাখতে
  share_plus: ^10.1.2  # আইডি মেইল/হোয়াটসঅ্যাপ/অন্য অ্যাপ দিয়ে শেয়ার করতে
  flutter_foreground_task: ^6.5.0  # স্ক্রিন-শেয়ার চলাকালীন foreground service (Android আবশ্যিক)
  google_fonts: ^6.2.1  # LinkCont লোগো-টেক্সটের জন্য Poppins ফন্ট (নিজে থেকে ডাউনলোড/ক্যাশে করে)

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  # ⚠️ এই তালিকা assets/image/ ফোল্ডারের আসল ফাইলগুলোর সাথে মিলিয়ে ঠিক
  # করা হয়েছে (screen_frem.webp আর computer_icon.webp ডিলিট হয়ে গিয়েছিল,
  # আর desing_icon.webp বানান ঠিক করে design_icon.webp হয়েছে)।
  assets:
    - assets/image/bg_frem.webp
    - assets/image/pc_tv_frem.webp
    - assets/image/design_icon.webp
    - assets/image/icon.webp
    - assets/image/software_icon.webp
