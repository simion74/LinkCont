plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0"
}

android {
    // ⚠️ প্যাকেজ নাম — lib/*.kt ফাইলগুলোর package declaration আর এটা একই থাকতে হবে
    namespace "com.example.remotescreen"
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    // ⚠️ এখানে ইচ্ছাকৃতভাবে একটা স্থির (fixed) debug keystore (android/app/debug.keystore,
    // রিপোতে কমিট করা) ব্যবহার করা হচ্ছে — GitHub Actions-এর ডিফল্ট debug keystore ব্যবহার
    // করলে প্রতিটা CI রানে (ফ্রেশ রানার) একটা নতুন, র‍্যান্ডম সিগনেচারের keystore তৈরি হতো,
    // ফলে প্রতিটা বিল্ডের APK ভিন্ন সিগনেচারে সাইন হচ্ছিল আর ফোনে আগের বিল্ড ইনস্টল থাকলে
    // নতুনটা "App not installed" এরর দিয়ে রিজেক্ট হয়ে যেত (সিগনেচার মিসম্যাচ, package name
    // একই)। এই স্থির keystore দিয়ে প্রতিটা CI বিল্ড একই সিগনেচার পাবে, তাই নতুন APK আগেরটার
    // উপর normal আপডেট হিসেবে বসে যাবে — এটা শুধু টেস্টিং/ডেভ পারপাসে, Play Store release
    // keystore আলাদা ও গোপন রাখতে হবে (README-তে উল্লেখ আছে)।
    signingConfigs {
        debug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    defaultConfig {
        // ⚠️ আগে "com.example.remotescreen" ছিল — এটা Flutter/Android টিউটোরিয়ালের
        // খুব কমন ডিফল্ট নাম, তাই ফোনে থাকা অন্য কোনো টেস্ট/ডেমো অ্যাপের সাথে
        // এই ID কনফ্লিক্ট করে "App not installed" এরর দিতে পারে (Play Protect
        // আর সিগনেচার দুটোই ঠিক থাকা সত্ত্বেও)। এখন নিজস্ব, ইউনিক ID।
        // ⚠️ namespace (উপরে) ইচ্ছাকৃতভাবে বদলানো হয়নি — সেটা Kotlin ফাইলের
        // package declaration-এর সাথে মিলতে হয়, কিন্তু applicationId (এখানে)
        // পুরোপুরি স্বাধীনভাবে বদলানো যায়, কোনো Kotlin ফাইল ছোঁয়া লাগে না।
        applicationId "com.linkcont.remotescreen"
        // flutter_webrtc + MediaProjection/AccessibilityService নির্ভরতার জন্য 24 (Android 7.0)-এর
        // নিচে নামানো উচিত না — নিচে নামালে বিল্ড/রানটাইম এরর হতে পারে
        minSdk 24
        targetSdk flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
    }

    buildTypes {
        release {
            // ⚠️ এখন debug key দিয়ে সাইন হচ্ছে, যাতে CI থেকে সরাসরি ইনস্টলযোগ্য
            // APK পাওয়া যায়। Play Store-এ পাবলিশ করার আগে এখানে আসল release
            // keystore বসাতে হবে (এবং GitHub Actions-এ secrets থেকে পাস করতে হবে)।
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source "../.."
}

dependencies {
    implementation "androidx.multidex:multidex:2.0.1"
}
