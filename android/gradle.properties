org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
android.nonTransitiveRClass=true

# AGP 9+ ডিফল্টভাবে নতুন DSL (android.newDsl) বাধ্যতামূলক করে, যেটাতে
# পুরো build.gradle নতুন করে লিখতে হয় (extensions.configure<>() স্টাইলে)।
# আপাতত পুরনো, পরিচিত DSL-এই কাজ চালানোর জন্য অপ্ট-আউট করা হলো — বিল্ড এখনই
# ভাঙবে না। মনে রাখবেন: AGP 10.0 (আনুমানিক ২০২৬-এর মাঝামাঝি) থেকে এই
# অপ্ট-আউট আর কাজ করবে না, তখন নতুন DSL-এ মাইগ্রেট করতে হবে।
android.newDsl=false
android.builtInKotlin=false
