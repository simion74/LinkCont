pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    // Flutter-এর বর্তমান stable ভার্সন এখন সর্বনিম্ন Gradle 9.1.0, AGP 9.0.1,
    // Kotlin 2.2.20 চায় (আগেরবার AGP 8.x-এ রেখেছিলাম, কিন্তু Flutter-এর
    // 'stable' চ্যানেল এগিয়ে যাওয়ায় সেটা আর যথেষ্ট না — তাই এবার AGP 9-এ
    // আপগ্রেড করা হলো, সাথে নিচে gradle.properties-এ android.newDsl=false
    // দিয়ে পুরনো DSL-স্টাইল build.gradle অপরিবর্তিত রেখেই কাজ চালানো হচ্ছে)
    id "com.android.application" version "9.0.1" apply false
    id "org.jetbrains.kotlin.android" version "2.2.20" apply false
}

include ":app"
